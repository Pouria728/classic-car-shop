<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اضافه کردن محصول جدید</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <h1><a href="index.html" style="color: white; text-decoration: none;">فروشگاه خودروهای کلاسیک</a></h1>
      <a href="index.html">🏠 صفحه اصلی</a>
      <a href="cart.html">🛒 سبد خرید: <span id="cartCount">0</span></a>
    </nav>
  </header>

  <main>
    <h2>اضافه کردن ماشین جدید</h2>
    <form id="addProductForm">
      <label for="name">نام ماشین:</label>
      <input type="text" id="name" required><br><br>

      <label for="price">قیمت (تومان):</label>
      <input type="number" id="price" min="1" required><br><br>

      <label for="image">تصویر ماشین:</label>
      <input type="file" id="image" accept="image/*" required><br><br>

      <label for="desc">توضیحات:</label>
      <textarea id="desc" required></textarea><br><br>

      <button type="submit">اضافه کردن محصول</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 فروشگاه خودروهای کلاسیک. تمامی حقوق محفوظ است.</p>
  </footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script>
    updateCartBadge();

    document.getElementById("addProductForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const price = parseInt(document.getElementById("price").value, 10);
      const desc = document.getElementById("desc").value;
      const imageFile = document.getElementById("image").files[0];

      if (!imageFile) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const image = event.target.result; // base64
        const newProduct = { id: nextProductId(), name, price, image, desc };
        addExtraProduct(newProduct);

        alert("محصول جدید اضافه شد!");
        window.location.href = "index.html";
      };
      reader.readAsDataURL(imageFile);
    });
  </script>
</body>
</html>
