<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه خودروهای کلاسیک</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <h1><a href="index.html" style="color: white; text-decoration: none;">فروشگاه خودروهای کلاسیک</a></h1>
      <a href="add-product.html">➕ اضافه کردن محصول</a>
      <a href="cart.html">🛒 سبد خرید: <span id="cartCount">0</span></a>
    </nav>
  </header>

  <main>
    <h2>خودروهای موجود</h2>
    <div id="productList"></div>
  </main>

  <footer>
    <p>&copy; 2026 فروشگاه خودروهای کلاسیک. تمامی حقوق محفوظ است.</p>
  </footer>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script>
    const productList = document.getElementById("productList");
    const allProducts = getAllProducts();

    if (allProducts.length === 0) {
      productList.innerHTML = "<p>در حال حاضر هیچ خودرویی ثبت نشده است.</p>";
    } else {
      productList.innerHTML = allProducts.map((p) => `
        <div class="product">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <p><b>${p.price.toLocaleString()} تومان</b></p>
          <a href="product.html?id=${p.id}">مشاهده و خرید</a>
        </div>
      `).join("");
    }

    updateCartBadge();
  </script>
</body>
</html>
